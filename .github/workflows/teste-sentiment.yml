name: Test Azure Language (Sentiment)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile
        run: |
          cd "Exercicio 4/produto3"
          ls -la
          javac sentiment.java

      - name: Run
        env:
          AZURE_LANGUAGE_KEY: ${{ secrets.AZURE_LANGUAGE_KEY }}
        run: |
          cd "Exercicio 4/produto3"
          java sentiment
